<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Syne:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0c1210;
      --foam: #f3f6f1;
      --moss: #1f6b4a;
      --lime: #c8f56a;
      --amber: #f0a35a;
      --mist: rgba(243, 246, 241, 0.72);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      color: var(--foam);
      font-family: "Syne", sans-serif;
      background: var(--ink);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }

    .sky {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 60% at 15% 20%, rgba(31, 107, 74, 0.55), transparent 55%),
        radial-gradient(ellipse 70% 50% at 85% 15%, rgba(240, 163, 90, 0.35), transparent 50%),
        radial-gradient(ellipse 80% 70% at 50% 100%, rgba(200, 245, 106, 0.18), transparent 55%),
        linear-gradient(165deg, #08100d 0%, #12241c 45%, #0a1411 100%);
      animation: sky-drift 18s ease-in-out infinite alternate;
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.14;
      mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .orb {
      position: absolute;
      width: min(52vw, 420px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, var(--lime), transparent 58%),
                  radial-gradient(circle at 70% 70%, var(--amber), transparent 55%);
      filter: blur(8px);
      opacity: 0.45;
      animation: orb-float 12s ease-in-out infinite;
    }

    .orb-a { top: 8%; left: 8%; }
    .orb-b {
      bottom: 6%;
      right: 10%;
      width: min(40vw, 300px);
      animation-delay: -4s;
      opacity: 0.3;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(92vw, 720px);
      padding: clamp(2rem, 6vw, 4rem);
      text-align: center;
    }

    .brand {
      display: inline-block;
      font-size: clamp(0.75rem, 1.4vw, 0.9rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--lime);
      margin-bottom: 1.4rem;
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    h1 {
      font-family: "Fraunces", serif;
      font-optical-sizing: auto;
      font-weight: 700;
      font-size: clamp(3.4rem, 14vw, 7.5rem);
      line-height: 0.92;
      letter-spacing: -0.03em;
      background: linear-gradient(120deg, var(--foam) 10%, var(--lime) 55%, var(--amber) 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation:
        rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards,
        shimmer 8s ease-in-out infinite;
      opacity: 0;
    }

    .line {
      width: 4.5rem;
      height: 2px;
      margin: 1.6rem auto;
      background: linear-gradient(90deg, transparent, var(--lime), transparent);
      opacity: 0;
      animation: rise 0.8s ease 0.45s forwards;
    }

    p {
      max-width: 28rem;
      margin: 0 auto;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      line-height: 1.55;
      color: var(--mist);
      font-weight: 500;
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards;
    }

    .cta {
      margin-top: 2.2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.85rem 1.35rem;
      border: 1px solid rgba(200, 245, 106, 0.35);
      background: rgba(31, 107, 74, 0.25);
      color: var(--foam);
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.04em;
      backdrop-filter: blur(8px);
      transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.7s forwards;
    }

    .cta:hover {
      transform: translateY(-2px);
      background: rgba(31, 107, 74, 0.45);
      border-color: var(--lime);
    }

    .cta span {
      color: var(--lime);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes orb-float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(18px, -24px) scale(1.06); }
    }

    @keyframes sky-drift {
      from { filter: hue-rotate(0deg); }
      to { filter: hue-rotate(12deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      h1, .brand, .line, p, .cta { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main>
    <div class="brand">Zero · Hello World</div>
    <h1>Hello<br />World</h1>
    <div class="line" aria-hidden="true"></div>
    <p>
      A quiet first page — hosted free through Zero, built for the moment
      an agent needs the open web.
    </p>
    <a class="cta" href="https://www.zero.xyz" target="_blank" rel="noopener">
      Powered by <span>zero.xyz</span>
    </a>
  </main>
</body>
</html>
